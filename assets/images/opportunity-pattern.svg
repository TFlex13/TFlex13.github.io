<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="gold" x1="0" y1="0" x2="1600" y2="900">
<stop offset="0%" stop-color="#F7D774"/>
<stop offset="50%" stop-color="#D4A62A"/>
<stop offset="100%" stop-color="#FFF1B8"/>
</linearGradient>

<filter id="softGlow">
<feGaussianBlur stdDeviation="6"/>
</filter>

</defs>

<!-- faint grid -->

<g opacity="0.05" stroke="white">

<line x1="100" y1="750" x2="1500" y2="750"/>
<line x1="100" y1="620" x2="1500" y2="620"/>
<line x1="100" y1="490" x2="1500" y2="490"/>
<line x1="100" y1="360" x2="1500" y2="360"/>
<line x1="100" y1="230" x2="1500" y2="230"/>

<line x1="300" y1="120" x2="300" y2="820"/>
<line x1="600" y1="120" x2="600" y2="820"/>
<line x1="900" y1="120" x2="900" y2="820"/>
<line x1="1200" y1="120" x2="1200" y2="820"/>

</g>

<!-- bar charts -->

<g opacity="0.12">

<rect x="200" y="600" width="28" height="120" rx="6" fill="white"/>
<rect x="240" y="540" width="28" height="180" rx="6" fill="url(#gold)"/>
<rect x="280" y="480" width="28" height="240" rx="6" fill="white"/>
<rect x="320" y="420" width="28" height="300" rx="6" fill="url(#gold)"/>
<rect x="360" y="360" width="28" height="360" rx="6" fill="white"/>

</g>

<!-- secondary bars -->

<g opacity="0.10">

<rect x="1250" y="520" width="24" height="140" rx="6" fill="white"/>
<rect x="1285" y="470" width="24" height="190" rx="6" fill="url(#gold)"/>
<rect x="1320" y="420" width="24" height="240" rx="6" fill="white"/>
<rect x="1355" y="370" width="24" height="290" rx="6" fill="url(#gold)"/>

</g>

<!-- candlestick style chart -->

<g opacity="0.12">

<line x1="560" y1="540" x2="560" y2="660" stroke="white" stroke-width="3"/>
<rect x="548" y="570" width="24" height="60" rx="4" fill="url(#gold)"/>

<line x1="610" y1="500" x2="610" y2="620" stroke="white" stroke-width="3"/>
<rect x="598" y="530" width="24" height="70" rx="4" fill="white"/>

<line x1="660" y1="450" x2="660" y2="580" stroke="white" stroke-width="3"/>
<rect x="648" y="480" width="24" height="70" rx="4" fill="url(#gold)"/>

<line x1="710" y1="410" x2="710" y2="540" stroke="white" stroke-width="3"/>
<rect x="698" y="440" width="24" height="70" rx="4" fill="white"/>

</g>

<!-- large upward growth graph -->

<path
d="M120 690
C260 650, 320 620, 420 580
C520 540, 610 510, 720 450
C840 390, 940 350, 1060 300
C1180 250, 1280 210, 1400 160"
stroke="url(#gold)"
stroke-width="8"
stroke-linecap="round"
stroke-linejoin="round"
opacity="0.9"
filter="url(#softGlow)"
/>

<!-- ghost secondary graph -->

<path
d="M140 720
C260 690, 360 650, 460 610
C580 560, 690 520, 820 470
C940 420, 1080 350, 1400 230"
stroke="white"
stroke-width="3"
stroke-dasharray="8 10"
opacity="0.18"
/>

<!-- arrow -->

<g transform="translate(1400 160) rotate(-20)">
<path d="M0 0 L-35 -18 L-28 0 L-35 18 Z" fill="url(#gold)"/>
</g>

<!-- large faint dollar signs -->

<g opacity="0.08" font-family="Arial, Helvetica, sans-serif" fill="url(#gold)">

<text x="120" y="260" font-size="180">$</text>
<text x="1180" y="260" font-size="220">$</text>
<text x="480" y="760" font-size="200">$</text>
<text x="1250" y="760" font-size="170">$</text>

</g>

<!-- finance symbols -->

<g opacity="0.12" font-family="Arial, Helvetica, sans-serif" fill="white">

<text x="900" y="700" font-size="42">%</text>
<text x="1000" y="160" font-size="36">+</text>
<text x="700" y="190" font-size="36">$</text>
<text x="420" y="210" font-size="32">%</text>

</g>

</svg>
